services:
  - type: web
    name: tpn-dashboard
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: TPN_USERNAME
        sync: false
      - key: TPN_PASSWORD
        sync: false
      - key: REFRESH_TOKEN
        generateValue: true
      - key: TPN_LOGIN_URL
        value: https://staging.tpnconnect.com/
      - key: HEADLESS
        value: "true"
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: REFRESH_MINUTES
        value: "15"
      - key: TIMEZONE
        value: Europe/London
